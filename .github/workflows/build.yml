name: build

# Compile verification only, for now — mirrors the "no local toolchain, CI is the
# sole verification" story in the Windows/macOS agent repos' own ARCHITECTURE.md
# §6/§7. `flutter build ios`/`flutter build appbundle` steps get added once the
# native ios/ and android/ scaffolds are generated and committed (see README.md
# — `flutter create` hasn't been run yet, so there's nothing to build against).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed .
