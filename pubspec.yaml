name: soar_mobile
description: "Applivery SOAR Agent — mobile companion app (iOS & Android)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  # Renders the splash screen's applivery-bp-login.svg logo (SplashScreen,
  # lib/splash/splash_screen.dart) — the only vector asset this app uses, so
  # this is a small, single-purpose addition rather than a general SVG
  # pipeline.
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/applivery_wordmark_on_light.png
    - assets/images/applivery_wordmark_on_dark.png
    - assets/images/applivery-bp-login.svg
    - assets/images/applivery-splash.svg

  # Same 3 Outfit weights the Windows/macOS agents bundle (Resources/Fonts,
  # tray/fonts) so the mobile app reads as the same product typographically
  # instead of falling back to the platform system font. Unlike those two
  # (which each had to register 3 separate font *families* — see the macOS
  # agent's FontLoader.swift doc comment for why: CoreText/GDI saw each
  # static instance as its own family, not a weight of one "Outfit" family),
  # Flutter's asset font declaration natively supports multiple weights
  # under a single family, so callers just do
  # TextStyle(fontFamily: 'Outfit', fontWeight: FontWeight.w600) — no
  # per-weight family-name lookup table needed on this platform.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
